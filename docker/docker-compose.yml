services:
  core:
    build: ../nebula-core
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["../nebula-core:/app"]
  agent:
    image: python:3.12-slim
    working_dir: /app
    command: python agent.py
    environment:
      NEBULA_CORE: http://core:8000
    volumes: ["../nebula-agent:/app"]
    depends_on: [core]
