<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nebula Admin</title><link rel="stylesheet" href="../styles.css"></head><body><main class="section"><span class="eyebrow">NEBULA ADMIN</span><p><input id="adminToken" placeholder="Admin token" type="password"><button class="btn" onclick="saveToken()">Save token</button></p><h1>Manage the entire orbit.</h1><div class="gridcards"><article class="card"><h3>Create plan</h3><input id="name" placeholder="Plan name"><select id="kind"><option>game</option><option>vps</option></select><input id="ram" type="number" placeholder="RAM MB"><input id="cpu" type="number" placeholder="CPU %"><input id="disk" type="number" placeholder="Disk MB"><input id="price" type="number" placeholder="Price in ₹"><button class="btn primary" onclick="createPlan()">Create</button></article><article class="card"><h3>Nodes</h3><div id="nodes">Loading...</div></article><article class="card"><h3>Payment QR</h3><p>Change the customer checkout QR without editing website code.</p><input id="qrUrl" placeholder="QR image URL or data URL"><button class="btn" onclick="saveQR()">Save QR</button><div id="qrStatus"></div></article><article class="card"><h3>Node maintenance</h3><input id="maintNode" type="number" placeholder="Node ID"><input id="maintMsg" placeholder="Maintenance message"><input id="maintUntil" type="number" placeholder="End time (Unix, optional)"><button class="btn" onclick="setMaintenance()">Enable maintenance</button><button class="btn" onclick="clearMaintenance()">Clear maintenance</button></article></div></main><script src="app.js"></script></body></html>
