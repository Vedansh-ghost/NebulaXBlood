<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070817"><title>Staff Login — NEBULAxBLOOD</title><link rel="stylesheet" href="styles.css"></head><body class=""><script src="config.js"></script><script src="site.js"></script><main><section class="hero" style="min-height:55vh"><div class="auth-card" style="margin:auto"><span class="eyebrow">STAFF ACCESS</span><h1>NEBULA Staff</h1><p>Enter your NEBULA ID to identify the staff account. Authorization is checked server-side through the database.</p><div class="field"><label>NEBULA ID</label><input id="nid" placeholder="NX-XXXXXXXX"></div><button class="btn primary" onclick="go()">Continue</button><p class="small muted">A typed ID alone does not grant staff privileges.</p></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>window.supabaseClient=window.supabase.createClient(window.NXB_CONFIG.supabaseUrl,window.NXB_CONFIG.supabaseKey);</script><script>async function go(){const id=document.getElementById('nid').value.trim();if(!id)return alert('Enter your NEBULA ID.');if(!supabaseClient)return alert('Supabase unavailable.');let u=await supabaseClient.auth.getUser();if(!u.data.user)return location.href='index.html';let p=await supabaseClient.from('profiles').select('id,nebula_id,role').eq('id',u.data.user.id).maybeSingle();if(!p.data||p.data.nebula_id!==id)return alert('NEBULA ID does not match your account.');if(!['staff','admin','owner','super_admin'].includes(p.data.role))return alert('This account is not authorized for staff access.');location.href='staff.html'}</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>window.supabaseClient=window.supabase.createClient(window.NXB_CONFIG.supabaseUrl,window.NXB_CONFIG.supabaseKey);</script></body></html>
