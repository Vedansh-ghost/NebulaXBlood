<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070817"><title>Website Studio — NEBULAxBLOOD</title><link rel="stylesheet" href="styles.css"></head><body class=""><script src="config.js"></script><script src="site.js"></script><main><section class="section"><span class="eyebrow">WEBSITE STUDIO</span><h1>Customize the universe</h1><p class="muted">These controls are local until you connect them to the website_settings table.</p><div class="gridcards"><article class="card"><h3>Visual effects</h3><label class="toggle">Nebula <input type="checkbox" checked onchange="toggle('nebula',this.checked)"></label><label class="toggle">Stars <input type="checkbox" checked onchange="toggle('stars',this.checked)"></label><label class="toggle">Grid <input type="checkbox" checked onchange="toggle('grid',this.checked)"></label><label class="toggle">Glow <input type="range" min="0" max="100" value="35" onchange="glow(this.value)"></label></article><article class="card"><h3>Branding</h3><div class="field"><label>Site name</label><input id="siteName" value="NEBULAxBLOOD" onchange="brand(this.value)"></div><div class="field"><label>Tagline</label><input id="tagline" value="Power Beyond the Orbit." onchange="localStorage.nxbTagline=this.value"></div><button class="btn" onclick="localStorage.clear();location.reload()">Reset local customization</button></article></div></section></main><script>function toggle(c,v){document.querySelector('.'+c).style.display=v?'block':'none';localStorage['nxb_'+c]=v}function glow(v){localStorage.nxbGlow='0 0 '+(10+v)+'px rgba(92,111,255,'+(v/100)+')';document.documentElement.style.setProperty('--glow',localStorage.nxbGlow)}function brand(v){localStorage.nxbName=v;document.querySelectorAll('#brandName').forEach(x=>x.textContent=v)} </script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>window.supabaseClient=window.supabase.createClient(window.NXB_CONFIG.supabaseUrl,window.NXB_CONFIG.supabaseKey);</script></body></html>
